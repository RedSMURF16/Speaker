SETTING_MAXS                        = 28.39 31.77 50.00

SETTING_SPEAKER_LOAD                = 1             # Whether to load saved Speakers data of the current map
SETTING_SPEAKER_CHECK               = 10.0          # Maximum selection distance when checking nearby Speakers
SETTING_SPEAKER_TASK                = 0.1           # Time interval in seconds to check for Speakers and apply their effects
SETTING_OFFSET_BASE                 = 120.0         # Default forward offset when previewing Speaker placement
SETTING_OFFSET                      = 65.0 900.0    # Default minimum and maximum offset from the player to the Speaker (MIN MAX)
SETTING_OFFSET_STEP                 = 10.0          # Step size when scrolling to move Speaker forward/backward
SETTING_GHOST_ALPHA                 = 120           # Transparency level of the ghost preview model (0 - 255)
SETTING_ROTATION_STEP               = 22.5          # Step size when rotating the Speaker

